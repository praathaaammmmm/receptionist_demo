{# "Back to dashboard" confirmation for an active demo conversation. Wired by js/leave-guard.js. #}
<dialog class="leave-dialog" id="leave-dialog" aria-labelledby="leave-title" aria-describedby="leave-text">
  <h2 id="leave-title">Leave this conversation?</h2>
  <p id="leave-text">Your active demo conversation will end.</p>
  <div class="leave-actions">
    <button class="btn" type="button" data-stay>Stay here</button>
    <button class="btn btn-primary" type="button" data-leave>Leave dashboard</button>
  </div>
</dialog>
